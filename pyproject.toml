[project]
name = "executive-productivity-agent"
version = "0.1.0"
description = "Executive Productivity Agent for Arjun Malhotra (VP Sales)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mistralai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "streamlit>=1.35.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
